name: CI/CD Multi-Stage Docker Hub Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app

jobs:
  # JOB 1: Build & Push ke Docker Hub
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      Contoh jika pakai Go:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          
      - name: Run tests
        run: go test -C .\app\ ./...

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Add metadata to image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: latest

      - name: Build and push multi-stage Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # JOB 2: Deploy ke Lokal (Berjalan di Self-Hosted Runner)
  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Pull latest Docker image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Re run docker-compose
        run: |
          docker compose build --no-cache
          docker compose up -d
          
      - name: Clean up unused images
        run: docker image prune -f
